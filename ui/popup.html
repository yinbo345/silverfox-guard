<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>银狐防护</title>
</head>
<body>
  <div class="app">
    <header class="head sf-rise" style="--d:0">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z" fill="rgba(120,180,255,.18)" stroke="#7db4ff" stroke-width="1.4"/>
          <path d="M12 7.5 6 9.5v3.2c0 3.4 2.3 5.8 6 7.6 3.7-1.8 6-4.2 6-7.6V9.5l-6-2Z" fill="rgba(120,180,255,.0)"/>
          <path d="M9 11.5l2 2 4-4" stroke="#9fe0c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="name">银狐防护</div>
          <div class="sub">SilverFox Guard</div>
        </div>
      </div>
      <span class="pill" id="globalPill">防护中</span>
    </header>

    <section class="card page-status sf-rise" style="--d:1">
      <div class="row">
        <span class="label">当前页面</span>
        <span class="value" id="pageStatus">检测中…</span>
      </div>
      <div class="row">
        <span class="label">风险分</span>
        <span class="value" id="pageScore">—</span>
      </div>
    </section>

    <section class="card stats sf-rise" style="--d:2">
      <div class="stat">
        <div class="num" id="statWarn">0</div>
        <div class="cap">拦截风险网站</div>
      </div>
      <div class="stat">
        <div class="num" id="statBlock">0</div>
        <div class="cap">拦截下载</div>
      </div>
    </section>

    <section class="card recent sf-rise" id="recentWrap" style="--d:3">
      <div class="sec-title">近期拦截记录</div>
      <ul class="recent-list" id="recentList"></ul>
    </section>

    <button class="settings-btn sf-rise" id="openSettings" style="--d:4">打开设置控制面板</button>

    <button class="report-btn sf-rise" id="openReport" style="--d:5">一键上报网站</button>
    <div class="report-menu" id="reportMenu" hidden>
      <div class="report-menu-title">选择上报类型</div>
      <button class="report-item" data-type="confirmed_phish">恶意 / 钓鱼站点举报</button>
      <button class="report-item" data-type="false_positive">误报反馈（正常站被拦）</button>
      <div class="report-status" id="reportStatus"></div>
      <button class="report-cancel" id="reportCancel">取消</button>
    </div>

    <button class="allow-btn sf-rise" id="addAllow" style="--d:6">加入白名单 · 不再拦截此站</button>
    <div class="allow-status" id="allowStatus"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
